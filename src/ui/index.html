<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rocky·todo</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪨</text></svg>"
    />
    <script>
      // 첫 페인트 전에 data-theme 을 확정해 FOUC 를 막는다. 번들 전에 실행돼야 해서
      // src/ui/lib.ts 의 resolveTheme 을 import 할 수 없다 — 같은 규칙을 복제한 것이니
      // 한쪽을 고치면 반드시 다른 쪽도 고쳐야 한다.
      // localStorage 는 프라이빗 모드/차단 설정에서 던질 수 있다. 클래식 인라인 스크립트의
      // 런타임 예외는 이 스크립트 실행만 중단시키고 문서 파싱 자체는 계속된다 — 이
      // try/catch 가 막는 건 파싱 중단이 아니라, 예외로 중단된 채 data-theme 이 아예
      // 안 붙는 것이다. catch 에서 명시적으로 "dark" 를 세팅해 대비시키지만, 다크 블록
      // 선택자가 `:root, :root[data-theme="dark"]` 라 속성이 없어도 결과는 같다 — 지금은
      // 사실상 중복이고, 이 선택자가 나중에 속성 필수로 바뀌면 의미가 생긴다.
      var stored, pref;
      try {
        stored = localStorage.getItem("rocky-todo:theme");
        pref = stored === "dark" || stored === "light" || stored === "auto" ? stored : "auto";
        document.documentElement.dataset.theme =
          pref === "auto"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : pref;
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
