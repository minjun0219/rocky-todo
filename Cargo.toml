# rocky-todo Rust workspace — 재작성 계획은 docs/rewrite/ 참고.
# app/ (Tauri) 는 Phase 4 에서 멤버로 합류한다.
[workspace]
resolver = "2"
members = [
  "crates/rocky-todo-core",
  "crates/rocky-todod",
  "crates/rocky-todo-cli",
]

[workspace.package]
version = "0.15.0-dev"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
ureq = { version = "3", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
