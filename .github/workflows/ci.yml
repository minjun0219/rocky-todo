name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # changeset 의 패키지 이름이 workspace 와 어긋나면 여기서 죽는다.
      # 이 검증이 없으면 main 에 머지된 뒤 Release 워크플로의 version 스텝에서야 터진다.
      - name: Changeset package name
        run: bun run check:changesets

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    name: rust fmt + clippy + test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Rust CLI 가 TS 판과 **같은 출력**을 내는지 — 포팅이 자기 테스트만 통과하고
      # 원본과 갈라지는 것을 막는 게이트다. 재작성이 끝나 TS 표면이 사라지면 지운다.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI + daemon
        run: cargo build --workspace

      - name: CLI parity (Rust vs TS)
        run: bun run check:cli-parity
